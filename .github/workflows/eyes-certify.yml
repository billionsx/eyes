name: eyes-certify
# ПИКСЕЛЬ-СЕРТИФИКАЦИЯ (ст. 56 · M3): первое число месяца — сертификат
# на КАЖДЫЙ подключённый проект, по его забранному коду.
on:
  schedule:
    - cron: "23 7 1 * *"
  workflow_dispatch:
concurrency:
  group: eyes-certify
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Инструменты"
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: "Забор кода проектов"
        env:
          EYES_PROJECTS_TOKEN: ${{ secrets.EYES_PROJECTS_TOKEN }}
        run: python3 bin/fetch.py
      - name: "Сертификат каждому проекту (скор · HTML · PDF · бейдж)"
        run: |
          for d in _projects/*/; do
            a=$(basename "$d")
            EYES_PROJECT="$a" PROJECT_ROOT="$d" python3 bin/certify.py --pdf
          done
      - name: "Подлинность выданного — реестр ↔ файлы (ст. 44)"
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "bin")
          import certify
          from pathlib import Path
          bad = []
          for d in sorted(Path("certificates").glob("*")):
              if d.is_dir():
                  for p in certify.verify_register(d):
                      bad.append(f"{d.name}: {p}")
          print("\n".join(bad) if bad else "реестры сертификатов чисты")
          sys.exit(1 if bad else 0)
          PY

      - name: "Эфир"
        if: always()
        run: python3 bin/dashboard.py
      - name: "Хроника сертификата"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes: сертификат месяца" certificates registry dashboard
