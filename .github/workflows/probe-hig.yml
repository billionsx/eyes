# РАЗОВЫЙ ЗОНД. Департамент строит органы по НАСТОЯЩЕМУ артефакту, а не по
# догадке о его строении. Здесь скачивается машинный JSON страниц HIG и
# кладётся в фикстуры, чтобы орган замера образцов писался и судился офлайн.
name: "Зонд · JSON страниц HIG"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: "Скачать машинный JSON Apple и осмотреть"
        run: |
          set -e
          mkdir -p registry/fixtures/apple
          for P in color dark-mode materials; do
            U="https://developer.apple.com/tutorials/data/design/human-interface-guidelines/$P.json"
            CODE=$(curl -sL -o "/tmp/$P.json" -w "%{http_code}" -H "Accept: application/json" -H "User-Agent: billions-x-eyes" "$U")
            SZ=$(wc -c < "/tmp/$P.json")
            echo "PROBE $P HTTP=$CODE SIZE=$SZ"
            if [ "$CODE" = "200" ] && [ "$SZ" -gt 2000 ]; then
              cp "/tmp/$P.json" "registry/fixtures/apple/hig-$P.json"
              python3 -c "import json,re,sys; raw=open('/tmp/$P.json',encoding='utf-8').read(); d=json.loads(raw); h=sorted(set(re.findall(r'#[0-9A-Fa-f]{6}\b',raw))); print('PROBE $P HEX=%d SAMPLE=%s' % (len(h), h[:10])); print('PROBE $P RGBFIELDS=%d' % len(re.findall(r'\"red\"\s*:', raw))); print('PROBE $P KEYS=%s' % list(d)[:12])"
            fi
          done
      - name: "Закрепить фикстуры"
        run: |
          git config user.email "eyes@billionsx"
          git config user.name "Billions X Eyes"
          git add registry/fixtures/apple || true
          git diff --cached --quiet || git commit -q -m "зонд: машинный JSON страниц HIG как фикстура"
          git push || echo "нечего пушить"
