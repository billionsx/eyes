name: eyes-yield
# УРОЖАЙ (устав ст. 49): веб-атлас, кит, большая семёрка, живой взгляд на прод
# подключённых проектов. Своя группа — пуши репозитория урожай не трогают.
#
# 16.08.2026 · РАЗДЕЛЕНИЕ УРОЖАЯ И РАЗВЕДКИ. Прежде эти органы ехали в одном
# контуре с обходчиком документации (eyes-atlas). Замер шести прогонов показал,
# что это была повозка, прицепленная к чужой лошади:
#
#   обходчик документации   1848 с   75%
#   веб-атлас                297 с   12%
#   большая семёрка          149 с    6%
#   кит · живой взгляд · эфир · суд   175 с    7%
#
# Три четверти хода тратил орган, чья выработка в суждение не втекает: 35 024
# нормы просмотрено, 60 кандидатов, принятых правил НОЛЬ — и это не упущение, а
# устав: ст. 37.2 прямо запрещает переносить числа библиотеки в базу стандартов
# (ст. 3), путь числа — только 📐 замер или 🍎 кит с адресом.
#
# Органы этого контура, наоборот, дают числа, которые двигают суждение:
# веб-атлас собрал 409 замеров кегля с семи лендингов Apple (12 → 96 px) —
# именно из них видно, что шкала ролей iOS к витрине неприменима. Держать такой
# орган на недельном ходу только потому, что он ехал в одной телеге с
# обходчиком, — платить частотой за чужую бесплодность.
#
# Поэтому урожай возвращается на СУТКИ и стоит 8 минут, а разведка остаётся в
# eyes-atlas без расписания, на ручном заводе.
on:
  schedule:
    - cron: "7 17 * * *"   # ежесуточно, 17:07 UTC — прежний слот урожая
  workflow_dispatch:
concurrency:
  group: eyes-yield
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  yield:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Инструменты"
        run: |
          pip install --quiet pillow numpy fonttools playwright
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
          command -v 7z >/dev/null || sudo apt-get -yq install p7zip-full >/dev/null
      - name: "Суд — короткий (гейт урожая)"
        run: python3 bin/eyes.py selftest > /dev/null
      - name: "Веб-атлас — кит лендингов Apple (ст. 36.3)"
        run: python3 bin/eyes.py weblab || true
      - name: "Большая семёрка — познание бизнес-логики (ст. 55)"
        timeout-minutes: 12
        continue-on-error: true
        run: |
          python3 bin/eyes.py consult > registry/bizlab/last-run.log 2>&1 || echo "ШАГ УПАЛ RC=$?" >> registry/bizlab/last-run.log
          tail -4 registry/bizlab/last-run.log
      - name: "Кит — величины официальных китов (ст. 36.1)"
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_KIT_KEY: ${{ secrets.FIGMA_KIT_KEY }}
        run: python3 bin/eyes.py kit || true
      - name: "Живой взгляд — прод подключённых проектов (ст. 37.3)"
        timeout-minutes: 10
        continue-on-error: true
        run: |
          python3 bin/liveview.py --live || echo "живой взгляд — см. registry/live"
      - name: "Эфир"
        if: always()
        run: python3 bin/dashboard.py
      - name: "Хроника урожая"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes: урожай (веб-атлас · кит · большая семёрка · живой взгляд)" registry dashboard

      - name: "Эфир снаружи — домен обязан отдавать свежую сборку (ст. 54)"
        if: always()
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            sleep 45
            python3 bin/livecheck.py && exit 0
          done
          echo "домен не догнал репозиторий за 6 минут — вердикт в registry/state/SITE.md"

      - name: "Хроника эфира снаружи"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes — вердикт эфира на домене" registry/state/SITE.md
