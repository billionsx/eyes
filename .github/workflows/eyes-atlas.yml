name: eyes-atlas
# РАЗВЕДКА (устав ст. 37.1): обход всей документации developer.apple.com шаг за
# шагом, без ИИ, с переживающим прогоны фронтиром. Своя группа — пуши
# репозитория разведку не трогают.
#
# 16.08.2026 · РАСПИСАНИЕ СНЯТО, ОРГАН ОСТАВЛЕН. Обходчик снят с расписания и
# живёт на ручном заводе. Основание — замер, а не мнение.
#
# ВЫРАБОТКА. За 30 дней: просмотрено 35 024 нормы, добыто 60 кандидатов,
# принятых правил — НОЛЬ. Все 20 действующих правил AE сделаны руками. И это не
# упущение основателя: ст. 37.2 прямо запрещает переносить числа библиотеки в
# базу стандартов (ст. 3) — путь числа в правило только 📐 замер кадра или
# 🍎 кит с адресом. Атлас по уставу — библиотека для чтения, а не источник норм.
# Значит частота его хода ничего в суждении не меняет по построению.
#
# СХОДИМОСТЬ. Пройдено 56 200 страниц, полных кругов НОЛЬ, фронт очереди 10 465
# и растёт быстрее чтения. Собственный отчёт органа (registry/atlas/YIELD.md)
# говорит прямо: 98% хода отдано классу адресов, который даёт связываемое число
# в двести раз реже первоисточника; разведка бесконечна по построению и до
# предмета не дойдёт никогда. Расписание такой обход не завершает — оно лишь
# платит за него регулярно.
#
# ЦЕНА. 1848 с на прогон — 75% хода бывшего общего контура. Соседние органы
# (веб-атлас, кит, большая семёрка, живой взгляд) стоили 8 минут на всех и
# выделены в собственный суточный контур eyes-yield: их числа в суждение
# втекают, и держать их на недельном ходу ради обходчика было платой частотой
# за чужую бесплодность.
#
# ЧТО СОХРАНЕНО. Библиотека законов (28 805 строк с адресами) и фронтир
# остаются на месте: `bin/law.py` ищет по ним как искал, состояние переживает
# паузу, и заведённый рукой прогон продолжит обход с той же страницы, а не с
# нуля. Орган не удалён — снят с довольствия. Вернуть на расписание — одна
# строка cron, и вернуть его следует тогда, когда появится доказанный путь от
# библиотеки к правилу, а не раньше.
on:
  workflow_dispatch:
concurrency:
  group: eyes-atlas
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Инструменты"
        run: |
          pip install --quiet pillow numpy fonttools playwright
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
          command -v 7z >/dev/null || sudo apt-get -yq install p7zip-full >/dev/null
      - name: "Суд — короткий (гейт разведки)"
        run: python3 bin/eyes.py selftest > /dev/null
      - name: "Атлас — шаг по всей документации (ст. 37.1)"
        run: python3 bin/eyes.py atlas --budget 1500
      - name: "Добытчик правил-кандидатов (свод → заготовки)"
        run: python3 bin/propose.py || true
      - name: "Эфир"
        if: always()
        run: python3 bin/dashboard.py
      - name: "Хроника разведки"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes: разведка (атлас документации)" registry dashboard
