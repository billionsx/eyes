name: eyes-frames
# ДОБЫТЧИК КАДРОВ (ст. 46). Кадры операционной системы берутся из ОТКРЫТОГО
# источника — страниц приложений самой Apple в App Store, — а не просятся у
# основателя. Замер по имеющимся 195 кадрам исчерпан; свидетельство показало,
# что текст свода нужных чисел не называет. Значит нужны кадры, и добыть их
# обязан департамент.
on:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:
concurrency:
  # Одна очередь на всех, кто коммитит в этот репозиторий: прогон eyes и
  # прогон добычи 05.08.2026 писали хронику одновременно, и коммит упал.
  # Это гонка, а не отказ, и лечится она ожиданием, а не повтором.
  group: eyes-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Суд добытчика — до всякой сети"
        run: python3 bin/frames.py --court
      - name: "Добыча кадров из App Store"
        run: python3 bin/frames.py --out /tmp/frames-new --limit 12
      - name: "Замер новых кадров"
        run: |
          pip install pillow --quiet
          python3 bin/geoscan.py --frames /tmp/frames-new --out /tmp/scan-new.json
      - name: "Суд сводки — до всякой записи"
        run: python3 bin/scansum.py --court
      - name: "Сводка замера в реестр: вся цепь, а не итог"
        # Кусок скрипта, вписанный прямо сюда, суда не имеет и первой же
        # ошибкой молча пишет нули — неотличимо от честного отсутствия кадров.
        # Ровно это и случилось 05.08.2026. Теперь это орган со своим судом.
        run: |
          python3 bin/scansum.py --frames /tmp/frames-new --scan /tmp/scan-new.json
      - name: "Запись в базу: закрывается только то, что сошлось"
        run: python3 bin/geofill.py --scan /tmp/scan-new.json --write
      - name: "Суд департамента"
        # Красные строки суда кладутся В РЕЕСТР до того, как шаг упадёт.
        # Журнал прогона департаменту недоступен (сеть ограничена), а суд,
        # падающий только в CI и зелёный с чистого клона, без своих строк
        # неотличим от загадки. Отказ обязан оставлять документ.
        run: |
          set +e
          python3 bin/eyes.py selftest > /tmp/court.txt 2>&1
          rc=$?
          {
            echo "# СУД ПОСЛЕДНЕГО ПРОГОНА · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "код возврата: $rc"
            echo
            echo '```'
            grep -c "✓" /tmp/court.txt | sed 's/^/зелёных: /'
            grep "✗" /tmp/court.txt || echo "красных строк нет"
            echo '```'
            echo
            echo "Последние 30 строк прогона:"
            echo '```'
            tail -30 /tmp/court.txt
            echo '```'
          } > registry/state/COURT-LAST.md
          exit $rc
      - name: "Эфир"
        if: always()
        run: python3 bin/dashboard.py
      - name: "Хроника добычи"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes: добыча кадров и замер" registry dashboard
