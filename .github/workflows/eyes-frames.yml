name: eyes-frames
# ДОБЫТЧИК КАДРОВ (ст. 46). Кадры операционной системы берутся из ОТКРЫТОГО
# источника — страниц приложений самой Apple в App Store, — а не просятся у
# основателя. Замер по имеющимся 195 кадрам исчерпан; свидетельство показало,
# что текст свода нужных чисел не называет. Значит нужны кадры, и добыть их
# обязан департамент.
on:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:
concurrency:
  # Одна очередь на всех, кто коммитит в этот репозиторий: прогон eyes и
  # прогон добычи 05.08.2026 писали хронику одновременно, и коммит упал.
  # Это гонка, а не отказ, и лечится она ожиданием, а не повтором.
  group: eyes-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Суд добытчика — до всякой сети"
        run: python3 bin/frames.py --court
      - name: "Добыча кадров из App Store"
        run: python3 bin/frames.py --out /tmp/frames-new --limit 12
      - name: "Замер новых кадров"
        run: |
          pip install pillow --quiet
          python3 bin/geoscan.py --frames /tmp/frames-new --out /tmp/scan-new.json
      - name: "Сводка замера в реестр (кадры исчезнут с раннером, числа — нет)"
        run: |
          python3 - <<'PY'
          import json, pathlib, collections
          d = json.load(open("/tmp/scan-new.json"))
          def top(vals, step=0.5, n=6):
              q = collections.Counter(round(v / step) * step for v in vals)
              return [{"v": v, "n": c} for v, c in q.most_common(n)]
          out = {
            "frames": len(d), "ok": sum(1 for x in d if x.get("ok")),
            "screens": top([x["screen_pt"][0] for x in d if x.get("screen_pt")], 1),
            "surfaces": sum(len(x.get("surfaces") or []) for x in d),
            "radii": top([s["radius_pt"] for x in d for s in (x.get("surfaces") or [])
                          if s.get("radius_pt", 0) > 0.5]),
            "rows": top([v for x in d for v in (x.get("rows_pt") or [])]),
            "bars": top([v for x in d for v in (x.get("bottom_bars_pt") or [])]),
          }
          pathlib.Path("registry/screens/SCAN-appstore.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
          print("сводка замера записана:", out["ok"], "кадров ·",
                out["surfaces"], "поверхностей")
          PY
      - name: "Запись в базу: закрывается только то, что сошлось"
        run: python3 bin/geofill.py --scan /tmp/scan-new.json --write
      - name: "Суд департамента"
        run: python3 bin/eyes.py selftest
      - name: "Эфир"
        if: always()
        run: python3 bin/dashboard.py
      - name: "Хроника добычи"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes: добыча кадров и замер" registry dashboard
