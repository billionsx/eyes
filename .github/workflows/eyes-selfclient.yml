name: eyes-selfclient
# СВЕРОЧНЫЙ КЛИЕНТ (ст. 56). Департамент подключает СЕБЯ так же, как клиента:
# зовёт вызываемый контур `eyes-watch-reusable.yml` теми же входами, что и
# десять строк в шаблоне `templates/eyes-client-push.yml`.
#
# Зачем. Контур ревью PR имел ноль прогонов за всё время и упал с первого
# живого запуска (прав не хватало). Сверка YAML такое не поймает: YAML не
# запускается. Поймает только прогон.
#
# Предмет суда — папка tests/client: там заведомые нарушения и заведомо чистый
# файл. Нарушения там не чинят.
on:
  push:
    paths:
      - "tests/client/**"
      - ".github/workflows/eyes-watch-reusable.yml"
      - ".github/workflows/eyes-selfclient.yml"
      - "bin/review.py"
      - "bin/lint.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  selfclient:
    uses: ./.github/workflows/eyes-watch-reusable.yml
    with:
      project: conformance
      globs: "tests/client/**/*.css"
