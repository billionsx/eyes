name: eyes-geoscan
# ЗАМЕР ГЕОМЕТРИИ ПО КАДРОТЕКЕ (ст. 36.2, ЗКН-Э002).
#
# База iOS 27 держит дыры «🕳 замерить». Взять их из iOS 26 значило бы
# подменить замер памятью, взять из головы — выдумать. Единственный честный
# источник — кадр экрана, где геометрия присутствует физически.
#
# Контур идёт по средам и сам добирает согласие: как только в релизе
# eyes-screens-v1 появляются новые кадры, ближайший прогон мерит их и
# закрывает те дыры, где улики сомкнулись. Остальные остаются дырами —
# но с записанным разбросом, чтобы было видно, чего не хватает.
on:
  schedule:
    - cron: "29 4 * * 3"
  workflow_dispatch:
concurrency:
  group: eyes-geoscan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Инструменты"
        run: pip install --quiet pillow numpy
      - name: "Суд органов до замера"
        run: |
          python3 bin/geoscan.py --court
          python3 bin/geofill.py --court
      - name: "Кадротека из релиза"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download eyes-screens-v1 -p 'frames.zip' -O /tmp/frames.zip
          mkdir -p /tmp/frames && unzip -q /tmp/frames.zip -d /tmp/frames
          echo "кадров: $(find /tmp/frames -type f \( -name '*.png' -o -name '*.jpg' \) | wc -l)"
      - name: "Замер геометрии"
        run: python3 bin/geoscan.py --frames /tmp/frames --out /tmp/geo.json
      - name: "Запись согласия в базу iOS 27"
        run: python3 bin/geofill.py --scan /tmp/geo.json --write
      - name: "Эфир"
        if: always()
        run: python3 bin/dashboard.py
      - name: "Хроника замера"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes: замер геометрии по кадротеке" registry dashboard
