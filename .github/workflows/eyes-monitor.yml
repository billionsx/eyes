name: eyes-monitor
# МОНИТОР ПРОДА (ст. 56 · M2). Автономный репозиторий не видит воркфлоу
# деплоя чужих проектов, поэтому монитор поднимается тремя путями:
#   1) repository_dispatch типа "deployed" — проект пингует департамент
#      сразу после своего деплоя (см. templates/ping-eyes.yml);
#   2) расписание — каждые 6 часов, даже если проект молчит;
#   3) руками (workflow_dispatch).
on:
  repository_dispatch:
    types: [deployed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency:
  group: eyes-monitor
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Инструменты"
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: "Монитор прода — живой взгляд, дифф с базовой линией (M2)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ github.event.client_payload.sha }}
          DEPLOY_REPO: ${{ github.event.client_payload.repo }}
        run: python3 bin/monitor.py
      - name: "Эфир"
        if: always()
        run: python3 bin/dashboard.py
      - name: "Хроника монитора"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes: монитор прода" registry dashboard
