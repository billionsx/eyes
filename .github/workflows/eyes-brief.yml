name: eyes-brief
# BIG7-БРИФ НЕДЕЛИ (ст. 56 · M6): понедельник.
on:
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:
concurrency:
  group: eyes-brief
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Бриф недели"
        run: python3 bin/brief.py
      - name: "Эфир"
        if: always()
        run: python3 bin/dashboard.py
      - name: "Хроника брифа"
        if: always()
        run: |
          bash bin/chronicle.sh "eyes: big7-бриф недели" briefs registry dashboard
