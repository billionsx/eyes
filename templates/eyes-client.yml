# BILLIONS X EYES · ПОДКЛЮЧЕНИЕ ПРОЕКТА (файл кладётся В РЕПОЗИТОРИЙ ПРОЕКТА
# как .github/workflows/eyes.yml). Ничего больше делать не нужно: ни submodule,
# ни GitHub App, ни секретов. Департамент сам придёт на каждый pull request
# и оставит построчные замечания числами своих законов.
name: eyes
on:
  pull_request:
    types: [opened, synchronize, reopened]
# ПРАВА. Без этого блока прогон умирает ДО первого шага: с 2023 года
# GitHub по умолчанию выдаёт токену только чтение, а вызываемый контур
# просит больше — превышение гасит запуск целиком (startup_failure),
# и надзор молчит так, будто код чист. Права вызывающего обязаны
# покрывать права вызываемого.
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    uses: billionsx/eyes/.github/workflows/eyes-review-reusable.yml@main
    with:
      project: МОЙ-ПРОЕКТ                       # ← имя проекта
      globs: "src/**/*.css,src/**/*.tsx"        # ← где лежит интерфейс
